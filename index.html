<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>अवतरली गौराई</title>

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #fff4df, #f8d7a5);
            font-family: Georgia, serif;
            text-align: center;
        }

        .box {
            max-width: 650px;
            margin: auto;
            padding: 25px 15px 40px;
        }

        h1 {
            color: #a51c30;
            font-size: 32px;
        }

        h2 {
            color: #8b5a00;
        }

        .photo {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            border: 5px solid #d4af37;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .jai {
            color: #a51c30;
            font-size: 22px;
            font-weight: bold;
            margin-top: 18px;
        }

        .author {
            color: #5d4037;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <div>🌺 🌸 🌺</div>

    <h1>॥ अवतरली गौराई ॥</h1>

    <h2>श्री महालक्ष्मी माता</h2>

    <img src="mahalaxmi.jpg"
         alt="श्री महालक्ष्मी माता"
         class="photo">

    <div class="jai">
        🌸 श्री महालक्ष्मी माता की जय 🌸
    </div>

    <div class="author">
        ✨ Author: <b>Sakshi</b> ✨
    </div>

    <div style="font-size:35px; margin-top:20px;">
        🪷 🪔 🪷
    </div>

</div>

</body>
</html>
