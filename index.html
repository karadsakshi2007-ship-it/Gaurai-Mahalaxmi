<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>अवतरली गौराई 🌺</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#fff8e7, #ffe0b2);
            font-family: Georgia, serif;
        }

        .card {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: #fffdf7;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            border: 3px solid #d4af37;
        }

        h1 {
            color: #9b1c31;
            font-size: 34px;
            margin-bottom: 5px;
        }

        h2 {
            color: #b8860b;
            margin-top: 5px;
        }

        .flower {
            font-size: 30px;
            letter-spacing: 10px;
        }

        svg {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        .author {
            margin-top: 15px;
            font-size: 18px;
            color: #6b3e26;
        }

        .bappa {
            margin-top: 12px;
            font-size: 20px;
            color: #9b1c31;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="flower">🌺 🌸 🌺</div>

    <h1>॥ अवतरली गौराई ॥</h1>

    <h2>श्री महालक्ष्मी माता</h2>

    <!-- Gaurai / Mahalaxmi Illustration -->
    <svg viewBox="0 0 400 500"
         xmlns="http://www.w3.org/2000/svg">

        <!-- Halo -->
        <circle cx="200" cy="145" r="115"
                fill="#ffe082"
                stroke="#c99700"
                stroke-width="5"/>

        <!-- Crown -->
        <path d="M130 115 L145 45 L175 85 L200 35
                 L225 85 L255 45 L270 115 Z"
              fill="#d4af37"
              stroke="#8b6508"
              stroke-width="4"/>

        <!-- Face -->
        <ellipse cx="200" cy="160"
                 rx="65" ry="75"
                 fill="#f3c6a5"
                 stroke="#8b4a2b"
                 stroke-width="3"/>

        <!-- Hair -->
        <path d="M140 145
                 Q120 90 200 75
                 Q280 90 260 145
                 Q275 220 245 245
                 L230 210
                 Q250 160 235 125
                 Q200 105 165 125
                 Q150 160 170 210
                 L155 245
                 Q125 215 140 145"
              fill="#2d1b16"/>

        <!-- Eyes -->
        <ellipse cx="175" cy="155" rx="8" ry="5" fill="#24140f"/>
        <ellipse cx="225" cy="155" rx="8" ry="5" fill="#24140f"/>

        <!-- Bindi -->
        <circle cx="200" cy="145" r="6" fill="#b30021"/>

        <!-- Nose -->
        <path d="M200 158 Q190 180 202 183"
              fill="none"
              stroke="#8b4a2b"
              stroke-width="3"/>

        <!-- Smile -->
        <path d="M180 195 Q200 210 220 195"
              fill="none"
              stroke="#9b1c31"
              stroke-width="4"/>

        <!-- Saree -->
        <path d="M135 245
                 Q200 215 265 245
                 L315 430
                 Q200 470 85 430 Z"
              fill="#b71c35"
              stroke="#8b1528"
              stroke-width="4"/>

        <!-- Saree Golden Border -->
        <path d="M110 410 Q200 445 290 410"
              fill="none"
              stroke="#ffd54f"
              stroke-width="12"/>

        <!-- Necklace -->
        <circle cx="200" cy="235"
                r="30"
                fill="none"
                stroke="#d4af37"
                stroke-width="10"/>

        <!-- Lotus -->
        <g transform="translate(200 390)">
            <ellipse rx="55" ry="20"
                     fill="#f48fb1"/>
            <ellipse rx="40" ry="25"
                     transform="rotate(30)"
                     fill="#ec407a"/>
            <ellipse rx="40" ry="25"
                     transform="rotate(-30)"
                     fill="#ec407a"/>
            <circle r="15" fill="#ffd54f"/>
        </g>

        <!-- Decorative dots -->
        <circle cx="95" cy="250" r="7" fill="#ffd54f"/>
        <circle cx="305" cy="250" r="7" fill="#ffd54f"/>
        <circle cx="80" cy="300" r="6" fill="#ffd54f"/>
        <circle cx="320" cy="300" r="6" fill="#ffd54f"/>

    </svg>

    <div class="bappa">
        🌺 श्री महालक्ष्मी माता की जय 🌺
    </div>

    <div class="author">
        ✨ Author: <b>Sakshi</b> ✨
    </div>

</div>

</body>
</html>
